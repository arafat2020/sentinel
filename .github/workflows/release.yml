name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libpcap
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build \
              -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/sentinel-linux-amd64 \
              ./cmd/sentinel

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-amd64
          path: dist/sentinel-linux-amd64

  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross-compile toolchain
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu libpcap-dev:arm64

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            go build \
              -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/sentinel-linux-arm64 \
              ./cmd/sentinel

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-arm64
          path: dist/sentinel-linux-arm64

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-linux-amd64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sentinel-linux-arm64
          path: dist

      - name: Checksums
        run: |
          cd dist
          chmod +x sentinel-linux-amd64 sentinel-linux-arm64
          sha256sum sentinel-linux-amd64 sentinel-linux-arm64 > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sentinel-linux-amd64
            dist/sentinel-linux-arm64
            dist/checksums.txt
