name: Release

# Tags publish a release. Pull requests into main run the same three builds
# without publishing, so a broken build is caught before a tag is pushed.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # libpcap: DNS capture. The rest are the headers and libraries the Fyne
      # desktop UI (--desktop) is compiled against: OpenGL, X11 and Wayland.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpcap-dev \
            pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            xorg-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build \
              -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/sentinel-linux-amd64 \
              ./cmd/sentinel

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-amd64
          path: dist/sentinel-linux-amd64

  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross-compile toolchain
        run: |
          sudo dpkg --add-architecture arm64
          sudo bash .github/scripts/setup-arm64-apt.sh
          # Same libraries as the amd64 job, in their arm64 builds. The X11
          # packages are listed individually instead of via the xorg-dev
          # metapackage, to keep the foreign-architecture install small.
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            pkg-config \
            libpcap-dev:arm64 \
            libgl1-mesa-dev:arm64 libegl1-mesa-dev:arm64 libgles2-mesa-dev:arm64 \
            libx11-dev:arm64 libxext-dev:arm64 libxcursor-dev:arm64 libxrandr-dev:arm64 \
            libxinerama-dev:arm64 libxi-dev:arm64 libxxf86vm-dev:arm64 \
            libxkbcommon-dev:arm64 \
            libwayland-dev:arm64

      - name: Build
        run: |
          mkdir -p dist
          # Point pkg-config at the arm64 .pc files only, so cgo never picks
          # up the runner's own amd64 libraries.
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
            go build \
              -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/sentinel-linux-arm64 \
              ./cmd/sentinel

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-arm64
          path: dist/sentinel-linux-arm64

  build-windows-amd64:
    name: Build windows/amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Npcap SDK
        shell: powershell
        run: |
          $url = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          $zip = "$env:TEMP\npcap-sdk.zip"
          $dir = "$env:TEMP\npcap-sdk"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir
          echo "CGO_CFLAGS=-I$dir/Include"                | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CGO_LDFLAGS=-L$dir/Lib/x64 -lwpcap"       | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            go build \
              -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/sentinel-windows-amd64.exe \
              ./cmd/sentinel

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-windows-amd64
          path: dist/sentinel-windows-amd64.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64, build-windows-amd64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-linux-amd64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sentinel-linux-arm64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sentinel-windows-amd64
          path: dist

      - name: Checksums
        run: |
          cd dist
          chmod +x sentinel-linux-amd64 sentinel-linux-arm64
          sha256sum sentinel-linux-amd64 sentinel-linux-arm64 sentinel-windows-amd64.exe > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sentinel-linux-amd64
            dist/sentinel-linux-arm64
            dist/sentinel-windows-amd64.exe
            dist/checksums.txt
